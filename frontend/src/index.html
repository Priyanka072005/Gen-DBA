<!DOCTYPE html>
<html>
<head>
    <title>Gen-DBA Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 20px;
        }

        h2 {
            color: #2c3e50;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        input {
            padding: 8px;
            width: 60%;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            padding: 8px 15px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #2980b9;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #ecf0f1;
        }

        .label {
            font-weight: bold;
            color: #34495e;
        }

        .priority-high {
            color: red;
            font-weight: bold;
        }

        .priority-medium {
            color: orange;
            font-weight: bold;
        }

        .priority-low {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Gen-DBA Query Analyzer</h2>

    <input type="number" id="queryId" placeholder="Enter Query ID">
    <button onclick="analyzeQuery()">Analyze</button>

    <div class="result" id="output"></div>
</div>

<script>
async function analyzeQuery() {
    const id = document.getElementById("queryId").value;

    const response = await fetch(`http://127.0.0.1:8000/analyze/${id}`);
    const data = await response.json();

    let priorityClass = "";
    if (data.priority === "HIGH") priorityClass = "priority-high";
    else if (data.priority === "MEDIUM") priorityClass = "priority-medium";
    else priorityClass = "priority-low";

    document.getElementById("output").innerHTML = `
        <p><span class="label">Query:</span> ${data.query}</p>
        <p><span class="label">Execution Time:</span> ${data.execution_time}</p>
        <p><span class="label">Issues:</span> ${data.issues}</p>
        <p><span class="label">Suggestion:</span> ${data.suggestion}</p>
        <p><span class="label">Priority:</span> <span class="${priorityClass}">${data.priority}</span></p>
    `;
}
</script>

</body>
</html>
